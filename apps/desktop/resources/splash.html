<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaOS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    body {
      position: relative;
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", Tahoma, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 22px 45px rgba(15, 23, 42, 0.16);
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      pointer-events: none;
    }

    body::before {
      top: -108px;
      right: -48px;
      background: #dbeafe;
    }

    body::after {
      bottom: -124px;
      left: -48px;
      background: #d9f9ea;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 28px 32px 24px;
      width: 100%;
    }

    .logo-box {
      width: 84px;
      height: 84px;
      padding: 8px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.12);
      animation: logo-in 520ms ease-out both;
    }

    .logo-icon {
      width: 100%;
      height: 100%;
      display: block;
    }

    .brand-title {
      color: #0f172a;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 26px;
      font-weight: 500;
      line-height: 1.5;
    }

    .progress-track {
      width: min(270px, 100%);
      height: 6px;
      background: #e5eaf2;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #2563eb, #38a3ff, #74e7b0);
      border-radius: 999px;
      animation: indeterminate 1.7s infinite cubic-bezier(0.65, 0.815, 0.735, 0.395);
    }

    @keyframes indeterminate {
      0% {
        left: -38%;
        width: 28%;
      }
      50% {
        width: 58%;
      }
      100% {
        left: 100%;
        width: 28%;
      }
    }

    .status-text {
      font-size: 12px;
      color: #64748b;
      min-height: 18px;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .version-tag {
      position: absolute;
      bottom: 13px;
      right: 18px;
      font-size: 10px;
      color: #94a3b8;
      font-family: monospace;
      direction: ltr;
    }

    .brand-kicker {
      color: #2563eb;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      line-height: 1;
      margin-bottom: 7px;
      direction: ltr;
    }

    @keyframes logo-in {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-box,
      .progress-bar { animation: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-box">
      <img class="logo-icon" src="brand/pharmaos-icon.svg" alt="" />
    </div>
    <div class="brand-kicker">PHARMA OPERATING SYSTEM</div>
    <div class="brand-title">PharmaOS</div>
    <div class="brand-subtitle">نظام التشغيل للصيدليات</div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
    <div class="status-text" id="status-text">جارٍ تجهيز بيئة الصيدلية...</div>
  </div>
  <div class="version-tag">v1.1.0</div>

  <script>
    if (window.splashApi && window.splashApi.onStatus) {
      window.splashApi.onStatus(function(data) {
        var el = document.getElementById('status-text');
        if (el && data && data.message) {
          el.textContent = data.message;
        }
      });
    }
  </script>
</body>
</html>
